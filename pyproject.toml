[project]
name = "aws-finops"
version = "1.0.0"
description = "Automated AWS FinOps platform – cost monitoring, anomaly detection, reporting & dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FinOps Team" }]
dependencies = [
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "pandas>=2.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "weasyprint>=63.0",
    "slack-sdk>=3.33.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "apscheduler>=3.10.4",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
    "types-boto3>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
finops-report = "app.reports.cli:main"
finops-serve = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ===== Ruff Configuration =====
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ===== Mypy Configuration =====
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

# ===== Pytest Configuration =====
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    "ignore:.*starlette.testclient is deprecated.*:DeprecationWarning",
    "ignore:.*starlette.testclient is deprecated.*:UserWarning",
    "ignore:.*httpx.*starlette.testclient.*",
]