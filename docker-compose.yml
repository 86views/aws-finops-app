services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:///./data/finops.db
      REPORT_OUTPUT_DIR: /app/data/reports
      SCHEDULER_ENABLED: "true"

    volumes:
      - ./data:/app/data
      - ${HOME}/.aws:/home/finops/.aws:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro    
