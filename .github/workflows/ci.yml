name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@015fec59ed9f3041c21c2262c1683cd4a8e23438 # v4.6.0
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd545c68009d7428f62c0b42f61a153282ebfa # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Terraform init (no backend)
        working-directory: terraform/environments/dev
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Checkov
        uses: bridgecrewio/checkov-action@ed16417bfcb603248386dd2fbfe74fae7f5db283 # v12.2827.0
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: cli

  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c100067645ef5db9026330089e5a87179069d35f # v3.10.0

      - name: Build image (with GitHub Actions Caching)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          load: true
          tags: aws-finops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (SARIF format)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394d2dd8c87dbb9 # v0.28.0
        with:
          image-ref: aws-finops:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@f602b5aaee205f2e642337d12f468f3a38e8fb47 # v3.28.11
        if: always()
        with:
          sarif_file: trivy-results.sarif